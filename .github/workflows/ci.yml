name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install (lint extras only, skip macOS-only deps)
        run: |
          uv venv
          uv pip install -e ".[dev]" --no-deps
          uv pip install "mcp>=1.0,<2" "pydantic>=2.6,<3" "python-dateutil>=2.8,<3"
      - name: Ruff
        run: uv run ruff check .
      - name: Black
        run: uv run black --check .
      - name: Mypy
        run: uv run mypy src/

  test-unit:
    name: Unit tests (${{ matrix.os }} / py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}
      - name: Install
        # On Linux the macOS-only deps (pyremindkit, pyobjc) are skipped via
        # the sys_platform marker. Unit tests mock pyremindkit so they run
        # everywhere.
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[test]"
      - name: Pytest (unit only)
        run: uv run pytest tests/unit/ -v --cov=src/mcp_apple_reminders --cov-report=xml
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: [lint, test-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Build sdist + wheel
        run: |
          uv venv
          uv pip install build twine
          uv run python -m build
          uv run twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
